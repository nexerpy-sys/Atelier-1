</style></head><body>
<p class="hud"><b>17</b>&nbsp;&nbsp;Gray–Scott · ∂v/∂t = Dᵥ∇²v + uv² − (F+k)v</p>
<canvas id="c" aria-label="Reaction-diffusion pattern growing — paint with the pointer"></canvas>
<p class="hint">Paint to seed growth</p>
<div class="modes" role="group" aria-label="Pattern regime">
  <button type="button" data-f=".0545" data-k=".062" aria-pressed="true">Coral</button>
  <button type="button" data-f=".0367" data-k=".0649" aria-pressed="false">Mitosis</button>
  <button type="button" data-f=".029" data-k=".057" aria-pressed="false">Maze</button>
</div>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const cv = document.getElementById('c'), S = AK.fit(cv), ctx = S.ctx, P = AK.ptr(cv);
  const NX = 176, NY = 104, SZ = NX * NY;
  let U = new Float32Array(SZ).fill(1), V = new Float32Array(SZ), U2 = new Float32Array(SZ).fill(1), V2 = new Float32Array(SZ);
  let Fd = 0.0545, K = 0.062;
  const off = document.createElement('canvas'); off.width = NX; off.height = NY;
  const octx = off.getContext('2d'), img = octx.createImageData(NX, NY);
  let cBg, cA, cInk; const theme = () => { cBg = AK.rgb('--bg'); cA = AK.rgb('--flame'); cInk = AK.rgb('--ink'); }; theme(); AK.onTheme(theme);

  function seed(x, y, r) {
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      const gx = (x + i) | 0, gy = (y + j) | 0;
      if (i * i + j * j <= r * r && gx > 0 && gy > 0 && gx < NX - 1 && gy < NY - 1) { V[gx + gy * NX] = 0.9; U[gx + gy * NX] = 0.2; }
    }
  }
  function reseed() { U.fill(1); V.fill(0); for (let i = 0; i < 16; i++) seed(8 + Math.random() * (NX - 16), 8 + Math.random() * (NY - 16), 2 + (Math.random() * 3 | 0)); }
  function step() {
    for (let y = 1; y < NY - 1; y++) for (let x = 1; x < NX - 1; x++) {
      const k = x + y * NX, u = U[k], v = V[k];
      const lu = (U[k - 1] + U[k + 1] + U[k - NX] + U[k + NX]) * 0.2 + (U[k - NX - 1] + U[k - NX + 1] + U[k + NX - 1] + U[k + NX + 1]) * 0.05 - u;
      const lv = (V[k - 1] + V[k + 1] + V[k - NX] + V[k + NX]) * 0.2 + (V[k - NX - 1] + V[k - NX + 1] + V[k + NX - 1] + V[k + NX + 1]) * 0.05 - v;
      const r = u * v * v;
      U2[k] = u + lu - r + Fd * (1 - u);
      V2[k] = v + 0.5 * lv + r - (Fd + K) * v;
    }
    let t = U; U = U2; U2 = t; t = V; V = V2; V2 = t;
  }
  function draw() {
    const d = img.data;
    for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
      const k = x + y * NX, o = k * 4, v = Math.min(1, V[k] * 2.9);
      const gx = x > 0 && x < NX - 1 ? V[k + 1] - V[k - 1] : 0, gy = y > 0 && y < NY - 1 ? V[k + NX] - V[k - NX] : 0;
      const lit = Math.max(-0.6, Math.min(1.2, -(gx + gy) * 5.5)), spec = lit > 0.5 ? (lit - 0.5) * 1.3 : 0;
      for (let c = 0; c < 3; c++) {
        let val = cBg[c] + (cA[c] - cBg[c]) * v * (0.72 + lit * 0.42);
        val += (cInk[c] - val) * Math.min(1, spec) * v;
        d[o + c] = val;
      }
      d[o + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, 1, 1, NX - 2, NY - 2, 0, 0, S.W, S.H);
  }
  document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.modes button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
    Fd = +b.dataset.f; K = +b.dataset.k; reseed();
  }));
  reseed();
  for (let i = 0; i < 900; i++) step();
  AK.loop(() => {
    if (P.in && (P.down || P.dx || P.dy)) { seed(P.x / S.W * NX, P.y / S.H * NY, P.down ? 4 : 2); P.dx = P.dy = 0; }
    for (let i = 0; i < 9; i++) step();
    draw();
  });
})();
</script></body></html>
