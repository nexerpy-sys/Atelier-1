</style></head><body>
<p class="hud"><b>18</b>&nbsp;&nbsp;Inverse kinematics · FABRIK × 3 passes · spring-lagged targets</p>
<canvas id="c" aria-label="Nine articulated strands reaching for your pointer"></canvas>
<p class="hint">Move — every strand reaches, none of them can quite touch</p>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const cv = document.getElementById('c'), S = AK.fit(cv), ctx = S.ctx, P = AK.ptr(cv);
  const STR = 9, SEG = 26; let strands = [], lw = 0, lh = 0;
  function init() {
    strands = [];
    for (let s = 0; s < STR; s++) {
      const f = (s + 0.5) / STR, ax = S.W * (0.08 + 0.84 * f), ay = S.H + 6, len = S.H * (0.62 + 0.2 * Math.sin(s * 2.4)) / SEG;
      const pts = []; for (let i = 0; i <= SEG; i++) pts.push({ x: ax, y: ay - i * len });
      strands.push({ ax, ay, len, pts, tx: ax, ty: S.H * 0.3, tvx: 0, tvy: 0, k: 26 + s * 7 % 30, ph: s * 1.7 });
    }
  }
  function solve(st) {
    const p = st.pts, n = p.length - 1;
    for (let it = 0; it < 3; it++) {
      p[n].x = st.tx; p[n].y = st.ty;
      for (let i = n - 1; i >= 0; i--) { const dx = p[i].x - p[i + 1].x, dy = p[i].y - p[i + 1].y, d = Math.hypot(dx, dy) || 1e-6; p[i].x = p[i + 1].x + dx / d * st.len; p[i].y = p[i + 1].y + dy / d * st.len; }
      p[0].x = st.ax; p[0].y = st.ay;
      for (let i = 1; i <= n; i++) { const dx = p[i].x - p[i - 1].x, dy = p[i].y - p[i - 1].y, d = Math.hypot(dx, dy) || 1e-6; p[i].x = p[i - 1].x + dx / d * st.len; p[i].y = p[i - 1].y + dy / d * st.len; }
    }
  }
  AK.loop((dt, t) => {
    if (S.W !== lw || S.H !== lh) { lw = S.W; lh = S.H; init(); }
    const W = S.W, H = S.H; ctx.clearRect(0, 0, W, H);
    const gx = P.in ? P.x : W * (0.5 + 0.34 * Math.sin(t * 0.5)), gy = P.in ? P.y : H * (0.36 + 0.2 * Math.sin(t * 0.83));
    const hg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 130); hg.addColorStop(0, AK.rgba('--flame', 0.2)); hg.addColorStop(1, AK.rgba('--flame', 0));
    ctx.fillStyle = hg; ctx.fillRect(gx - 130, gy - 130, 260, 260);
    strands.forEach((st, s) => {
      const ox = Math.sin(t * 0.9 + st.ph) * 26, oy = Math.cos(t * 0.7 + st.ph * 1.3) * 20;
      const reach = SEG * st.len, dxa = gx + ox - st.ax, dya = gy + oy - st.ay, da = Math.hypot(dxa, dya) || 1, cl = Math.min(1, reach * 0.985 / da);
      const txg = st.ax + dxa * cl, tyg = st.ay + dya * cl;
      st.tvx += ((txg - st.tx) * st.k - st.tvx * 6.5) * dt; st.tvy += ((tyg - st.ty) * st.k - st.tvy * 6.5) * dt;
      st.tx += st.tvx * dt; st.ty += st.tvy * dt;
      solve(st);
      const p = st.pts, n = p.length - 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 0; i < n; i++) {
        const f = i / n;
        ctx.strokeStyle = AK.rgba(f > 0.8 ? '--flame' : '--ink', 0.16 + f * 0.7); ctx.lineWidth = 5.2 * (1 - f) + 0.9;
        ctx.beginPath(); ctx.moveTo(p[i].x, p[i].y); ctx.lineTo(p[i + 1].x, p[i + 1].y); ctx.stroke();
      }
      ctx.fillStyle = AK.css('--bg'); ctx.strokeStyle = AK.rgba('--ink', 0.5); ctx.lineWidth = 1;
      for (let i = 4; i < n - 3; i += 4) { ctx.beginPath(); ctx.arc(p[i].x, p[i].y, 2.6 * (1 - i / n) + 1.2, 0, 6.283); ctx.fill(); ctx.stroke(); }
      const d = Math.hypot(p[n].x - gx, p[n].y - gy), near = Math.max(0, 1 - d / 160);
      ctx.fillStyle = AK.css('--flame'); ctx.beginPath(); ctx.arc(p[n].x, p[n].y, 2.5 + near * 3.5, 0, 6.283); ctx.fill();
      if (near > 0.05) { ctx.strokeStyle = AK.rgba('--gold', near * 0.55); ctx.lineWidth = 0.8; ctx.setLineDash([2, 5]); ctx.beginPath(); ctx.moveTo(p[n].x, p[n].y); ctx.lineTo(gx, gy); ctx.stroke(); ctx.setLineDash([]); }
    });
    ctx.strokeStyle = AK.css('--gold'); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(gx, gy, 7, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx - 13, gy); ctx.lineTo(gx - 4, gy); ctx.moveTo(gx + 4, gy); ctx.lineTo(gx + 13, gy); ctx.moveTo(gx, gy - 13); ctx.lineTo(gx, gy - 4); ctx.moveTo(gx, gy + 4); ctx.lineTo(gx, gy + 13); ctx.stroke();
  });
})();
</script></body></html>
