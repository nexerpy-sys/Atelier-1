</style></head><body>
<p class="hud"><b>24</b>&nbsp;&nbsp;x(t) = 1 − e^(−ζω₀t)(cos ω_d t + ζω₀/ω_d · sin ω_d t) → linear()</p>
<div class="ctl">
  <label>Stiffness<output id="oK">260</output><input id="k" type="range" min="40" max="600" step="1" value="260" /></label>
  <label>Damping<output id="oC">16</output><input id="cc" type="range" min="4" max="60" step="0.5" value="16" /></label>
  <label>Mass<output id="oM">1.0</output><input id="m" type="range" min="0.4" max="4" step="0.1" value="1" /></label>
  <p class="meta" id="meta"></p>
</div>
<div class="view">
  <canvas id="plot" aria-label="Spring step-response curve"></canvas>
  <div class="lane"><div id="puck"></div></div>
  <button id="code" type="button" aria-label="Copy generated CSS transition"></button>
</div>
<p class="hint">Tune · copy · paste — real spring motion in pure CSS</p>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id), cv = $('plot'), S = AK.fit(cv), ctx = S.ctx, puck = $('puck'), code = $('code');
  let css = '', dur = 0.6, zeta = 0, shown = 0, anim = null, flash = 0;
  function solver(k, c, m) {
    const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    if (z < 0.999) { const wd = w0 * Math.sqrt(1 - z * z); return { z, x: (t) => 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t)) }; }
    if (z < 1.001) return { z, x: (t) => 1 - Math.exp(-w0 * t) * (1 + w0 * t) };
    const s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
    return { z, x: (t) => 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1) };
  }
  let sol = solver(260, 16, 1);
  function rebuild() {
    const k = +$('k').value, c = +$('cc').value, m = +$('m').value; $('oK').textContent = k; $('oC').textContent = c; $('oM').textContent = m.toFixed(1);
    sol = solver(k, c, m); zeta = sol.z;
    dur = 0.2; for (let t = 6; t > 0.2; t -= 1 / 240) if (Math.abs(sol.x(t) - 1) > 0.0015) { dur = t; break; }
    const n = Math.max(16, Math.min(56, Math.round(dur * 46))), pts = [];
    for (let i = 0; i <= n; i++) pts.push(i === n ? 1 : +sol.x(dur * i / n).toFixed(3));
    const ease = `linear(${pts.join(', ')})`; css = `transition: transform ${Math.round(dur * 1000)}ms ${ease};`;
    code.innerHTML = `<b>transition:</b> transform ${Math.round(dur * 1000)}ms ${ease};`;
    $('meta').innerHTML = `ζ ${zeta.toFixed(2)} · ${zeta < 0.999 ? 'under-damped' : zeta < 1.001 ? 'critical' : 'over-damped'}<br>settles in ${Math.round(dur * 1000)} ms · ${n + 1} stops`;
    shown = 0; play();
  }
  let dir = 1;
  function play() {
    if (AK.RM || !puck.animate) return;
    const lane = puck.parentNode.clientWidth - 24, from = dir > 0 ? 0 : lane, to = dir > 0 ? lane : 0; dir = -dir;
    const frames = []; for (let i = 0; i <= 60; i++) frames.push({ transform: `translateX(${(from + (to - from) * sol.x(dur * i / 60)).toFixed(2)}px)` });
    frames[60] = { transform: `translateX(${to}px)` };
    if (anim) anim.cancel(); anim = puck.animate(frames, { duration: dur * 1000, fill: 'forwards' }); anim.onfinish = () => setTimeout(() => { if (anim && anim.playState === 'finished') play(); }, 700);
  }
  ['k', 'cc', 'm'].forEach((id) => $(id).addEventListener('input', rebuild));
  code.addEventListener('click', () => { const done = () => { flash = 1; code.style.borderColor = 'var(--flame)'; setTimeout(() => code.style.borderColor = '', 500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(css).then(done, done); else done(); });

  AK.loop((dt) => {
    const W = S.W, H = S.H, pad = 8, top = H * 0.16, base = H * 0.86, T = Math.max(dur * 1.12, 0.3); ctx.clearRect(0, 0, W, H);
    shown = AK.RM ? 1 : Math.min(1, shown + dt * 2.4); flash *= 0.92;
    const Y = (v) => base - (v) * (base - top) * 0.72, X = (t) => pad + (W - pad * 2) * t / T;
    ctx.strokeStyle = AK.css('--line'); ctx.lineWidth = 1; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(pad, Y(1)); ctx.lineTo(W - pad, Y(1)); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(pad, Y(0)); ctx.lineTo(W - pad, Y(0)); ctx.stroke();
    ctx.strokeStyle = AK.rgba('--gold', 0.5); ctx.beginPath(); ctx.moveTo(X(dur), Y(0) + 5); ctx.lineTo(X(dur), Y(1) - 12); ctx.stroke();
    const n = 220, lim = Math.floor(n * (1 - Math.pow(1 - shown, 3)));
    ctx.beginPath(); for (let i = 0; i <= lim; i++) { const t = T * i / n, x = X(t), y = Y(sol.x(t)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = AK.css('--flame'); ctx.lineWidth = 2 + flash * 2; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.lineTo(X(T * lim / n), Y(0)); ctx.lineTo(pad, Y(0)); ctx.closePath();
    const g = ctx.createLinearGradient(0, top, 0, base); g.addColorStop(0, AK.rgba('--flame', 0.22)); g.addColorStop(1, AK.rgba('--flame', 0)); ctx.fillStyle = g; ctx.fill();
    const tl = T * lim / n; ctx.fillStyle = AK.css('--ink'); ctx.beginPath(); ctx.arc(X(tl), Y(sol.x(tl)), 3.2, 0, 6.283); ctx.fill();
  });
  rebuild();
})();
</script></body></html>
