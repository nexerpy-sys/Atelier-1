<style>

</style></head><body>
<p class="hud"><b>29</b>&nbsp;&nbsp;Three.js · 16,000 GPU particles · ∇×ψ curl-noise morph</p>
<p class="read" id="read">16,000 pts</p>
<canvas id="c" aria-label="Interactive 3D GPU curl-noise particle sculpture"></canvas>
<p class="hint">Move to disturb field · morph attractor geometry</p>
<div class="modes" role="group" aria-label="Attractor shape">
  <button type="button" data-m="0" aria-pressed="true">Torus</button>
  <button type="button" data-m="1" aria-pressed="false">Helix</button>
  <button type="button" data-m="2" aria-pressed="false">Sphere</button>
</div>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => { const c = rgb(v); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      if (ctx) ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => { if (!P.down) return; P.down = false; if (P.onUp) P.onUp(e); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
</script>
<script type="module">
const cv = document.getElementById('c'), P = AK.ptr(cv);
let targetMode = 0;
document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.modes button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  targetMode = +b.dataset.m;
}));

function startFallback() {
  const S = AK.fit(cv), ctx = S.ctx;
  const N = 420;
  AK.loop((dt, t) => {
    ctx.clearRect(0, 0, S.W, S.H);
    const cx = S.W / 2, cy = S.H / 2, R = Math.min(S.W, S.H) * 0.28;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 * 3 + t * 0.4;
      const r = R * (0.65 + 0.35 * Math.sin(i * 0.21 + t));
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a * 0.9) * r * 0.68;
      ctx.fillStyle = i % 7 === 0 ? AK.css('--flame') : AK.rgba('--ink', 0.6);
      ctx.fillRect(x, y, 2, 2);
    }
  });
}

try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 100);
  camera.position.set(0, 0, 5.2);

  const COUNT = 16000;
  const posA = new Float32Array(COUNT * 3);
  const posB = new Float32Array(COUNT * 3);
  const posC = new Float32Array(COUNT * 3);
  const seed = new Float32Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI * 2;
    /* Torus */
    const R = 1.45, r = 0.52 + (Math.random() - 0.5) * 0.16;
    posA[i*3] = (R + r * Math.cos(v)) * Math.cos(u);
    posA[i*3+1] = (R + r * Math.cos(v)) * Math.sin(u);
    posA[i*3+2] = r * Math.sin(v);
    /* Double Helix */
    const ht = (i / COUNT - 0.5) * Math.PI * 6;
    const strand = i % 2 === 0 ? 0 : Math.PI;
    const hr = 0.95 + (Math.random() - 0.5) * 0.25;
    posB[i*3] = Math.cos(ht + strand) * hr;
    posB[i*3+1] = (i / COUNT - 0.5) * 3.1;
    posB[i*3+2] = Math.sin(ht + strand) * hr;
    /* Fibonacci Sphere */
    const phi = Math.acos(1 - 2 * (i + 0.5) / COUNT), th = Math.PI * (1 + Math.sqrt(5)) * i;
    const sr = 1.55 + (Math.random() - 0.5) * 0.14;
    posC[i*3] = sr * Math.sin(phi) * Math.cos(th);
    posC[i*3+1] = sr * Math.cos(phi);
    posC[i*3+2] = sr * Math.sin(phi) * Math.sin(th);
    seed[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posA, 3));
  geo.setAttribute('aHelix', new THREE.BufferAttribute(posB, 3));
  geo.setAttribute('aSphere', new THREE.BufferAttribute(posC, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

  const uniforms = {
    uTime: { value: 0 },
    uW1: { value: 0 },
    uW2: { value: 0 },
    uPtr: { value: new THREE.Vector3(0, 0, 0) },
    uPtrOn: { value: 0 },
    uFlame: { value: new THREE.Color('#ff3d00') },
    uGold: { value: new THREE.Color('#e5a93c') },
    uInk: { value: new THREE.Color('#f4f2ec') },
    uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) }
  };

  const VS = `
attribute vec3 aHelix, aSphere;
attribute float aSeed;
uniform float uTime, uW1, uW2, uPtrOn, uDpr;
uniform vec3 uPtr;
varying float vMix, vAlpha;
vec3 curl(vec3 p){
  float e = 0.25;
  float x = sin(p.y * 1.4 + uTime * 0.6) - cos(p.z * 1.4 - uTime * 0.5);
  float y = sin(p.z * 1.4 + uTime * 0.5) - cos(p.x * 1.4 + uTime * 0.7);
  float z = sin(p.x * 1.4 - uTime * 0.6) - cos(p.y * 1.4 + uTime * 0.4);
  return vec3(x, y, z) * e;
}
void main(){
  float w0 = max(0.0, 1.0 - uW1 - uW2);
  vec3 p = position * w0 + aHelix * uW1 + aSphere * uW2;
  vec3 c = curl(p + aSeed * 1.3);
  p += c * (0.45 + 0.55 * sin(uTime * 0.8 + aSeed * 6.283));
  vec3 d = p - uPtr;
  float dist = length(d);
  p += normalize(d + 0.0001) * smoothstep(1.35, 0.0, dist) * 0.75 * uPtrOn;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp((9.0 + aSeed * 8.0) * uDpr / max(1.2, -mv.z), 1.4, 7.0);
  vMix = aSeed;
  vAlpha = smoothstep(8.5, 2.2, -mv.z);
}`;

  const FS = `
uniform vec3 uFlame, uGold, uInk;
varying float vMix, vAlpha;
void main(){
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;
  float soft = smoothstep(0.5, 0.08, d);
  vec3 col = vMix > 0.82 ? uFlame : (vMix > 0.62 ? uGold : uInk);
  gl_FragColor = vec4(col, soft * vAlpha * 0.78);
}`;

  const mat = new THREE.ShaderMaterial({
    vertexShader: VS, fragmentShader: FS, uniforms,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  const syncTheme = () => {
    const dark = AK.rgb('--bg')[0] < 90;
    scene.background = new THREE.Color(AK.css('--bg'));
    uniforms.uFlame.value.set(AK.css('--flame'));
    uniforms.uGold.value.set(AK.css('--gold'));
    uniforms.uInk.value.set(AK.css('--ink'));
    mat.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
    mat.needsUpdate = true;
  };
  syncTheme(); AK.onTheme(syncTheme);

  const resize = () => {
    const w = Math.max(1, cv.clientWidth), h = Math.max(1, cv.clientHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  resize();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);

  let w1 = 0, w2 = 0, pOn = 0;
  const tick = (dt, t) => {
    const tw1 = targetMode === 1 ? 1 : 0, tw2 = targetMode === 2 ? 1 : 0;
    w1 += (tw1 - w1) * Math.min(1, dt * 4.2);
    w2 += (tw2 - w2) * Math.min(1, dt * 4.2);
    pOn += ((P.in ? 1 : 0) - pOn) * Math.min(1, dt * 6);
    uniforms.uTime.value = t;
    uniforms.uW1.value = w1;
    uniforms.uW2.value = w2;
    uniforms.uPtrOn.value = pOn;
    if (P.in) {
      uniforms.uPtr.value.set((P.x / Math.max(1, cv.clientWidth) * 2 - 1) * 2.2, -(P.y / Math.max(1, cv.clientHeight) * 2 - 1) * 1.5, 0.2);
    }
    pts.rotation.y = t * 0.14;
    pts.rotation.x = Math.sin(t * 0.11) * 0.25;
    renderer.render(scene, camera);
  };
  if (AK.RM) { tick(0.016, 1.0); }
  else { AK.loop(tick); }
} catch (_) {
  startFallback();
}
</script>
<script>
(() => {
  const releaseAll = () => {
    document.querySelectorAll('canvas').forEach((c) => {
      try {
        const gl = c.getContext('webgl2') || c.getContext('webgl');
        gl?.getExtension('WEBGL_lose_context')?.loseContext();
      } catch (_) {}
    });
  };
  document.querySelectorAll('canvas').forEach((c) => {
    c.addEventListener('webglcontextlost', (e) => { e.preventDefault(); }, false);
  });
  window.addEventListener('pagehide', releaseAll);
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'ak-dispose') releaseAll();
  });
})();
</script>
