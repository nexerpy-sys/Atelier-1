<p class="hud"><b>19</b>&nbsp;&nbsp;Rigid discs · impulse resolution · e = 0.42 · rolling friction</p>
<canvas id="c" aria-label="A pit of physical tags you can pick up and throw"></canvas>
<p class="hint">Pick one up · throw it into the pile</p>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const cv = document.getElementById('c'), S = AK.fit(cv), ctx = S.ctx, P = AK.ptr(cv);
  const TAGS = ['Type', 'Motion', 'Grid', 'Colour', 'Spring', 'Easing', 'Grain', 'Tokens', 'Rhythm', 'Contrast', 'Kerning', 'Depth', 'Hairline', 'Scale', 'Light', 'Craft'];
  const G = 2100, E = 0.42; let B = [], held = null, hvx = 0, hvy = 0, lw = 0, lh = 0;
  function init() {
    const u = Math.max(26, Math.min(S.W, S.H) * 0.085);
    B = TAGS.map((label, i) => {
      const r = u * (0.82 + ((i * 7) % 5) * 0.13);
      return { label, r, m: r * r, x: S.W * (0.12 + 0.76 * ((i * 0.618) % 1)), y: -r - i * u * 1.5, vx: (i % 2 ? 1 : -1) * 60, vy: 0, a: (i * 1.3) % 6.28, w: 0, hot: i === 4, squash: 0 };
    });
  }
  P.onDown = () => { held = null; for (const b of B) if (Math.hypot(b.x - P.x, b.y - P.y) < b.r) held = b; if (held) cv.classList.add('grab'); hvx = hvy = 0; };
  P.onUp = () => { if (held) { held.vx = hvx; held.vy = hvy; } held = null; cv.classList.remove('grab'); };

  function step(h) {
    const W = S.W, H = S.H - 14;
    for (const b of B) {
      if (b === held) {
        const nx = b.x + (P.x - b.x) * Math.min(1, h * 30), ny = b.y + (P.y - b.y) * Math.min(1, h * 30);
        hvx = hvx * 0.8 + (nx - b.x) / h * 0.2; hvy = hvy * 0.8 + (ny - b.y) / h * 0.2;
        b.vx = (nx - b.x) / h; b.vy = (ny - b.y) / h; b.x = nx; b.y = ny; b.w *= 0.9; continue;
      }
      b.vy += G * h; b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 1 - 0.6 * h;
      if (b.y + b.r > H) { if (b.vy > 220) b.squash = Math.min(0.2, b.vy / 5200); b.y = H - b.r; b.vy = -b.vy * E; if (Math.abs(b.vy) < 34) b.vy = 0; b.vx *= 1 - 1.6 * h; b.w += (b.vx / b.r - b.w) * 0.25; }
      if (b.x - b.r < 0) { b.x = b.r; b.vx = -b.vx * E; b.w += (-b.vy / b.r - b.w) * 0.2; }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -b.vx * E; b.w += (b.vy / b.r - b.w) * 0.2; }
    }
    for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++) {
      const a = B[i], b = B[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ia = a === held ? 0 : 1 / a.m, ib = b === held ? 0 : 1 / b.m, inv = ia + ib; if (!inv) continue;
      const pen = (rr - d) * 0.8 / inv;
      a.x -= nx * pen * ia; a.y -= ny * pen * ia; b.x += nx * pen * ib; b.y += ny * pen * ib;
      const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny; if (vn > 0) continue;
      const jn = -(1 + E) * vn / inv;
      a.vx -= jn * nx * ia; a.vy -= jn * ny * ia; b.vx += jn * nx * ib; b.vy += jn * ny * ib;
      const vt = rvx * -ny + rvy * nx;
      a.w += vt / a.r * 0.06; b.w += vt / b.r * 0.06;
    }
  }
  function draw() {
    ctx.clearRect(0, 0, S.W, S.H);
    ctx.strokeStyle = AK.css('--line-strong'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, S.H - 13.5); ctx.lineTo(S.W, S.H - 13.5); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of B) {
      b.squash *= 0.86;
      ctx.save(); ctx.translate(b.x, b.y + b.r * b.squash); ctx.scale(1 + b.squash, 1 - b.squash);
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = b === held ? 40 : 18; ctx.shadowOffsetY = b === held ? 22 : 8;
      ctx.fillStyle = b.hot ? AK.css('--flame') : AK.css('--surface'); ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.283); ctx.fill();
      ctx.shadowColor = 'transparent';
      const g = ctx.createLinearGradient(-b.r, -b.r, b.r, b.r); g.addColorStop(0, 'rgba(255,255,255,.13)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.22)');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = b.hot ? 'rgba(255,255,255,.35)' : AK.css('--line-strong'); ctx.lineWidth = 1; ctx.stroke();
      ctx.rotate(b.a);
      ctx.fillStyle = b.hot ? '#fff' : AK.css('--ink'); ctx.font = `700 ${Math.round(b.r * 0.33)}px Syne, sans-serif`;
      ctx.fillText(b.label.toUpperCase(), 0, 1);
      ctx.fillStyle = b.hot ? 'rgba(255,255,255,.7)' : AK.css('--muted'); ctx.beginPath(); ctx.arc(0, -b.r * 0.66, 1.6, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }
  AK.loop((dt) => {
    if (S.W !== lw || S.H !== lh) { lw = S.W; lh = S.H; init(); if (AK.RM) for (let i = 0; i < 1500; i++) step(1 / 240); }
    for (let i = 0; i < 4; i++) step(dt / 4);
    draw();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
