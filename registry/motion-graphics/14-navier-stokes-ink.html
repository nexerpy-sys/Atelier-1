<!DOCTYPE html>
<!-- Atelier Kinetik · Motion Graphics 14 · Navier–Stokes Ink Field — Stam stable-fluids solver (semi-Lagrangian advection + pressure projection) on a 112×64 grid, two-dye ink. Zero dependencies. -->
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik Motion — Navier–Stokes Ink Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root, :root[data-theme="obsidian"] {
  --bg: #070709;
  --surface: #0d0d12;
  --surface-hi: #12121a;
  --ink: #f4f2ec;
  --muted: #8e8d8a;
  --line: rgba(244, 242, 236, 0.10);
  --line-strong: rgba(244, 242, 236, 0.24);

}
:root[data-theme="paper"] {

  --surface: #ece9e0;

  --line-strong: rgba(14, 14, 16, 0.24);

:root[data-theme="aegean"] {
  --bg: #06121a;

  --line: rgba(230, 247, 255, 0.11);
  --line-strong: rgba(230, 247, 255, 0.25);

  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);

  font-size:clamp(1.5rem,4.6vw,3.2rem); line-height:1; color:var(--ink); mix-blend-mode:difference; }

</style></head><body>
<p class="hud"><b>14</b>&nbsp;&nbsp;Stable fluids · semi-Lagrangian advection · ∇·u = 0</p>
<canvas id="c" aria-label="Incompressible ink simulation — stir with the pointer"></canvas>
<h1>Stir the ink.</h1>
<p class="hint">Drag to stir · it never repeats</p>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const cv = document.getElementById('c'), S = AK.fit(cv), ctx = S.ctx, P = AK.ptr(cv);
  const NX = 112, NY = 64, SW = NX + 2, SZ = SW * (NY + 2), IX = (i, j) => i + SW * j;
  const F = () => new Float32Array(SZ);
  let u = F(), v = F(), u0 = F(), v0 = F(), a = F(), b = F(), t0 = F(); const p = F(), div = F();
  const off = document.createElement('canvas'); off.width = NX; off.height = NY;
  const octx = off.getContext('2d'), img = octx.createImageData(NX, NY);
  let cBg = [7, 7, 9], cA = [255, 61, 0], cB = [0, 240, 255];
  const theme = () => { cBg = AK.rgb('--bg'); cA = AK.rgb('--flame'); cB = AK.rgb('--cyan'); };
  theme(); AK.onTheme(theme);

  function advect(d, d0, dt) {
    for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
      const k = IX(i, j);
      let x = i - dt * u0[k], y = j - dt * v0[k];
      x = x < 0.5 ? 0.5 : x > NX + 0.5 ? NX + 0.5 : x; y = y < 0.5 ? 0.5 : y > NY + 0.5 ? NY + 0.5 : y;
      const i0 = x | 0, j0 = y | 0, s1 = x - i0, t1 = y - j0, q = IX(i0, j0);
      d[k] = (1 - s1) * ((1 - t1) * d0[q] + t1 * d0[q + SW]) + s1 * ((1 - t1) * d0[q + 1] + t1 * d0[q + 1 + SW]);
    }
  }
  function project() {
    for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
      const k = IX(i, j); div[k] = -0.5 * (u[k + 1] - u[k - 1] + v[k + SW] - v[k - SW]); p[k] = 0;
    }
    for (let n = 0; n < 12; n++) for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
      const k = IX(i, j); p[k] = (div[k] + p[k - 1] + p[k + 1] + p[k - SW] + p[k + SW]) * 0.25;
    }
    for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
      const k = IX(i, j); u[k] -= 0.5 * (p[k + 1] - p[k - 1]); v[k] -= 0.5 * (p[k + SW] - p[k - SW]);
    }
    for (let i = 0; i < SW; i++) { u[i] = v[i] = u[SZ - 1 - i] = v[SZ - 1 - i] = 0; }
    for (let j = 0; j < NY + 2; j++) { u[IX(0, j)] = v[IX(0, j)] = u[IX(NX + 1, j)] = v[IX(NX + 1, j)] = 0; }
  }
  function splat(gx, gy, fx, fy, dye, amt) {
    const R = 3.2, x0 = Math.max(1, (gx - 7) | 0), x1 = Math.min(NX, (gx + 7) | 0), y0 = Math.max(1, (gy - 7) | 0), y1 = Math.min(NY, (gy + 7) | 0);
    for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
      const w = Math.exp(-((i - gx) ** 2 + (j - gy) ** 2) / (R * R)), k = IX(i, j);
      u[k] += fx * w; v[k] += fy * w; dye[k] = Math.min(1.6, dye[k] + amt * w);
    }
  }
  let flip = 0;
  function step(dt, t) {
    const cx = NX / 2, cy = NY / 2, r = NY * 0.3;
    splat(cx + Math.cos(t * 0.5) * r * 1.9, cy + Math.sin(t * 0.7) * r, -Math.sin(t * 0.5) * 26, Math.cos(t * 0.7) * 22, a, 0.09);
    splat(cx - Math.cos(t * 0.4) * r * 1.7, cy - Math.sin(t * 0.6) * r, Math.sin(t * 0.4) * 24, -Math.cos(t * 0.6) * 24, b, 0.07);
    if (P.in && (P.dx || P.dy)) {
      const gx = P.x / S.W * NX + 1, gy = P.y / S.H * NY + 1, k = P.down ? 46 : 22;
      splat(gx, gy, P.dx / S.W * NX * k, P.dy / S.H * NY * k, (flip++ >> 5) & 1 ? b : a, P.down ? 0.5 : 0.22);
      P.dx = P.dy = 0;
    }
    let tmp = u0; u0 = u; u = tmp; tmp = v0; v0 = v; v = tmp;
    advect(u, u0, dt); advect(v, v0, dt);
    project();
    u0.set(u); v0.set(v);
    advect(t0, a, dt); tmp = a; a = t0; t0 = tmp;
    advect(t0, b, dt); tmp = b; b = t0; t0 = tmp;
    const fade = Math.pow(0.80, dt), damp = Math.pow(0.86, dt);
    for (let k = 0; k < SZ; k++) { a[k] *= fade; b[k] *= fade; u[k] *= damp; v[k] *= damp; }
  }
  function draw() {
    const d = img.data; let o = 0;
    for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
      const k = IX(i, j), da = Math.min(1, a[k]), db = Math.min(1, b[k]);
      const lit = 1 + Math.max(-0.4, Math.min(0.7, ((a[k] + b[k]) - (a[k + 1 + SW] + b[k + 1 + SW])) * 2.2));
      for (let c = 0; c < 3; c++) {
        let val = cBg[c]; val += (cA[c] - val) * da; val += (cB[c] - val) * db * 0.85;
        d[o + c] = cBg[c] + (val - cBg[c]) * lit;
      }
      d[o + 3] = 255; o += 4;
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, 0, 0, S.W, S.H);
  }
  for (let i = 0; i < 90; i++) step(1 / 60, i / 60);
  AK.loop((dt, t) => { step(dt, t + 1.5); draw(); });
})();
</script></body></html>
