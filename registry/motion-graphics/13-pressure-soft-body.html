<!DOCTYPE html>
<!-- Atelier Kinetik · Motion Graphics 13 · Pressure Soft Body — ideal-gas pressure model + edge springs on a Verlet ring; grab it, stretch it, throw it. Zero dependencies. -->
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetik Motion — Pressure Soft Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root, :root[data-theme="obsidian"] {
  --bg: #070709;
  --surface: #0d0d12;
  --surface-hi: #12121a;
  --ink: #f4f2ec;
  --muted: #8e8d8a;
  --line: rgba(244, 242, 236, 0.10);
  --line-strong: rgba(244, 242, 236, 0.24);
  --flame: #ff3d00;
  --gold: #e5a93c;
  --cyan: #00f0ff;
}
:root[data-theme="paper"] {
  --bg: #f4f2ec;
  --surface: #ece9e0;
  --surface-hi: #e2dfd5;
  --ink: #0e0e10;
  --muted: #666560;
  --line: rgba(14, 14, 16, 0.10);
  --line-strong: rgba(14, 14, 16, 0.24);
  --flame: #e03500;
  --gold: #9a6d14;
  --cyan: #007a8c;
}
:root[data-theme="aegean"] {
  --bg: #06121a;
  --surface: #0b1e29;
  --surface-hi: #112a38;
  --ink: #e6f7ff;
  --muted: #7aa7ba;
  --line: rgba(230, 247, 255, 0.11);
  --line-strong: rgba(230, 247, 255, 0.25);
  --flame: #00f0ff;
  --gold: #e5a93c;
  --cyan: #ff6b35;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.25s ease, color 0.25s ease;
}
canvas#c {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none;
}
.hud, .read, .hint {
  position: absolute; z-index: 3; pointer-events: none;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); user-select: none;
}
.hud { top: 1rem; left: 1.25rem; }
.hud b { color: var(--flame); font-weight: 600; }
.read { top: 1rem; right: 1.25rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.hint { bottom: 1rem; left: 50%; transform: translateX(-50%); white-space: nowrap; }
button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
canvas#c { cursor:grab; } canvas#c.grab { cursor:grabbing; }

/* === AK v2.2 Mobile & Iframe Layout Guard === */
.hud {
  max-width: calc(100% - 9.5rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.read {
  max-width: 8.5rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
}
@media (max-width: 560px) {
  .hud, .read, .hint {
    font-size: 8px !important;
    letter-spacing: 0.13em !important;
  }
  .hud { top: 0.7rem !important; left: 0.85rem !important; max-width: calc(100% - 7.8rem) !important; }
  .read { top: 0.7rem !important; right: 0.85rem !important; max-width: 6.8rem !important; }
  .hint { bottom: 0.7rem !important; font-size: 7.5px !important; }
  h1 {
    left: 0.85rem !important;

  }
  .modes, .dock {

  }
  .modes button, .dock button {

  }
}

</style></head><body>
<p class="hud"><b>13</b>&nbsp;&nbsp;Pressure soft body · PV = k · Verlet ring × 32</p>
<p class="read" id="read">vol 100%</p>
<canvas id="c" aria-label="A soft body you can grab, stretch and throw"></canvas>
<p class="hint">Grab it · stretch it · throw it at a wall</p>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const cv = document.getElementById('c'), S = AK.fit(cv), ctx = S.ctx, P = AK.ptr(cv), read = document.getElementById('read');
  const N = 32, TAU = Math.PI * 2, SUB = 6, G = 1900, KS = 1100, PK = 1700, KD = 150;
  let pts = [], R0 = 0, rest = 0, A0 = 1, grab = -1, floorY = 0, vol = 1;

  function init() {
    R0 = Math.min(S.W, S.H) * 0.19; rest = 2 * R0 * Math.sin(Math.PI / N); A0 = Math.PI * R0 * R0; pts = [];
    for (let i = 0; i < N; i++) {
      const a = i / N * TAU, x = S.W / 2 + Math.cos(a) * R0, y = S.H * 0.36 + Math.sin(a) * R0;
      pts.push({ x, y, px: x - 2.2, py: y, ax: 0, ay: 0 });
    }
  }
  P.onDown = () => {
    let best = 1e9; grab = -1;
    pts.forEach((p, i) => { const d = Math.hypot(p.x - P.x, p.y - P.y); if (d < best) { best = d; grab = i; } });
    if (best > R0 * 2.2) grab = -1; else cv.classList.add('grab');
  };
  P.onUp = () => { grab = -1; cv.classList.remove('grab'); };

  function area() { let a = 0; for (let i = 0; i < N; i++) { const p = pts[i], q = pts[(i + 1) % N]; a += p.x * q.y - q.x * p.y; } return a / 2; }

  function step(h) {
    const A = Math.max(A0 * 0.08, area()); vol = A / A0;
    const pr = Math.min(PK * 3, PK * (A0 / A - 1));
    for (const p of pts) { p.ax = 0; p.ay = G; }
    for (let i = 0; i < N; i++) {
      const p = pts[i], q = pts[(i + 1) % N];
      const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1e-6;
      const f = KS * (len - rest) / len;
      p.ax += dx * f; p.ay += dy * f; q.ax -= dx * f; q.ay -= dy * f;
      const nx = dy * pr * 0.5, ny = -dx * pr * 0.5;
      p.ax += nx; p.ay += ny; q.ax += nx; q.ay += ny;
    }
    if (grab >= 0) for (let i = 0; i < N; i++) {
      let di = Math.abs(i - grab); di = Math.min(di, N - di);
      const w = Math.exp(-di * di / 9), p = pts[i];
      p.ax += (P.x - p.x) * KD * w - (p.x - p.px) / h * 9 * w; p.ay += (P.y - p.y) * KD * w - (p.y - p.py) / h * 9 * w;
    }
    const pad = 10;
    for (const p of pts) {
      const vx = (p.x - p.px) * 0.9992, vy = (p.y - p.py) * 0.9992;
      p.px = p.x; p.py = p.y; p.x += vx + p.ax * h * h; p.y += vy + p.ay * h * h;
      if (p.y > floorY) { p.y = floorY; p.py = p.y + (p.y - p.py) * 0.35; p.px = p.x - (p.x - p.px) * 0.86; }
      if (p.y < pad) { p.y = pad; p.py = p.y + (p.y - p.py) * 0.35; }
      if (p.x < pad) { p.x = pad; p.px = p.x + (p.x - p.px) * 0.35; }
      if (p.x > S.W - pad) { p.x = S.W - pad; p.px = p.x + (p.x - p.px) * 0.35; }
    }
  }

  function draw() {
    const W = S.W, H = S.H; ctx.clearRect(0, 0, W, H);
    let cx = 0, cy = 0, minY = 1e9, maxY = -1e9, minX = 1e9, maxX = -1e9;
    for (const p of pts) { cx += p.x; cy += p.y; minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }
    cx /= N; cy /= N;
    ctx.strokeStyle = AK.css('--line-strong'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, floorY + .5); ctx.lineTo(W, floorY + .5); ctx.stroke();
    const lift = Math.max(0, floorY - maxY), sw = (maxX - minX) * 0.5 * (1 + lift / 260), sa = 0.5 / (1 + lift / 60);
    const sg = ctx.createRadialGradient(cx, floorY + 4, 0, cx, floorY + 4, sw);
    sg.addColorStop(0, `rgba(0,0,0,${sa})`); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.translate(0, floorY + 4); ctx.scale(1, 0.12); ctx.translate(0, -(floorY + 4)); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, floorY + 4, sw, 0, TAU); ctx.fill(); ctx.restore();
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const p = pts[i % N], q = pts[(i + 1) % N], mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p.x, p.y, mx, my);
    }
    ctx.closePath();
    const r = Math.max(maxX - minX, maxY - minY) * 0.62;
    const g = ctx.createRadialGradient(cx - r * 0.38, cy - r * 0.46, r * 0.05, cx, cy, r * 1.15);
    g.addColorStop(0, AK.rgba('--flame', 1)); g.addColorStop(0.55, AK.rgba('--flame', 0.82)); g.addColorStop(1, AK.rgba('--flame', 0.42));
    ctx.fillStyle = AK.css('--surface'); ctx.fill(); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip();
    const hl = ctx.createRadialGradient(cx - r * 0.34, minY + (maxY - minY) * 0.2, 0, cx - r * 0.34, minY + (maxY - minY) * 0.2, r * 0.6);
    hl.addColorStop(0, 'rgba(255,255,255,.42)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl; ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
    const sh = ctx.createLinearGradient(0, cy, 0, maxY); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.34)');
    ctx.fillStyle = sh; ctx.fillRect(minX, cy, maxX - minX, maxY - cy + 2);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.stroke();
    read.textContent = 'vol ' + Math.round(vol * 100) + '%';
  }

  let lw = 0, lh = 0;
  AK.loop((dt) => {
    if (S.W !== lw || S.H !== lh) { lw = S.W; lh = S.H; floorY = S.H - 54; init(); }
    const h = dt / SUB; for (let i = 0; i < SUB; i++) step(h);
    draw();
  });
})();
</script></body></html>
