<!DOCTYPE html>
<!-- Atelier Kinetik · Motion Graphics 25 · Caustic Wave Tank — 2D wave-equation PDE (∂²h/∂t² = c²∇²h − γ∂h/∂t) coupled to a single-draw-call WebGL optical caustic & chromatic refraction shader (with Canvas2D fallback). Zero dependencies. -->
<html lang="en" data-theme="obsidian">
<head><script>if(window.self!==window.top)document.documentElement.classList.add('ak-embedded');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetik Motion 25 — Caustic Wave Tank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root, :root[data-theme="obsidian"] {
      --bg: #070709;
      --surface: #0d0d12;
      --ink: #f4f2ec;
      --muted: #8e8d8a;
      --line: rgba(244, 242, 236, 0.12);
      --line-strong: rgba(244, 242, 236, 0.24);
      --flame: #ff3d00;
      --gold: #e5a93c;
      --cyan: #00f0ff;
    }
    :root[data-theme="paper"] {
      --bg: #f4f2ec;
      --surface: #ece9e0;
      --ink: #0e0e10;
      --muted: #666560;
      --line: rgba(14, 14, 16, 0.12);
      --line-strong: rgba(14, 14, 16, 0.24);
      --flame: #e03500;
      --gold: #9a6d14;
      --cyan: #007a8c;
    }
    :root[data-theme="aegean"] {
      --bg: #06121a;
      --surface: #0b1e29;
      --ink: #e6f7ff;
      --muted: #7aa7ba;
      --line: rgba(230, 247, 255, 0.12);
      --line-strong: rgba(230, 247, 255, 0.26);
      --flame: #00f0ff;
      --gold: #e5a93c;
      --cyan: #ff6b35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }
    canvas#c {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none; cursor: crosshair;
    }
    .hud, .read, .hint {
      position: absolute; z-index: 3; pointer-events: none;
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); user-select: none;
    }
    .hud { top: 1rem; left: 1.25rem; }
    .hud b { color: var(--flame); font-weight: 600; }
    .read { top: 1rem; right: 1.25rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    h1 {
      position: absolute; left: 1.25rem; bottom: 2.7rem; z-index: 2; pointer-events: none;
      font-family: "Syne", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em;
      font-size: clamp(1.35rem, 4.2vw, 2.9rem); line-height: 0.94; color: var(--ink);
    }
    h1 span {
      display: block; font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400;
      text-transform: none; letter-spacing: 0; color: var(--flame);
    }
    .hint { left: 1.25rem; bottom: 1rem; }
    .dock {
      position: absolute; right: 1.25rem; bottom: 1rem; z-index: 4;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    }
    .dock button {
      font: inherit; font-size: 8.5px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); background: color-mix(in srgb, var(--bg) 72%, transparent);
      border: 1px solid var(--line-strong); border-radius: 99px; padding: 6px 11px;
      cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: color 0.25s, border-color 0.25s, background-color 0.25s, transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .dock button:hover { color: var(--ink); border-color: var(--ink); }
    .dock button:active { transform: scale(0.94); }
    .dock button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
    .dock button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
    .sep { width: 1px; height: 14px; background: var(--line-strong); margin: 0 2px; }
  
/* === AK v2.2 Mobile & Iframe Layout Guard === */
.hud {
  max-width: calc(100% - 9.5rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

  max-width: 8.5rem;
  white-space: nowrap;
  overflow: hidden;

  text-align: right;

  .hud { top: 0.7rem !important; left: 0.85rem !important; max-width: calc(100% - 7.8rem) !important; }
  .read { top: 0.7rem !important; right: 0.85rem !important; max-width: 6.8rem !important; }

    left: 0.85rem !important;
    right: 0.85rem !important;
    font-size: clamp(1.1rem, 5.2vw, 1.8rem) !important;
  }
  .modes, .dock {
    right: 0.85rem !important;
    left: 0.85rem !important;
    bottom: 0.7rem !important;
    justify-content: flex-start !important;
    gap: 5px !important;
  }
  .modes button, .dock button {

  }
}

@media (max-width: 560px) {

}

/* Hide duplicate theme switcher inside iframe when parent sticky bar already controls theme */
html.ak-embedded .sep,
html.ak-embedded [data-theme-btn] { display: none !important; }
@media (max-width: 560px) {
  .dock { bottom: 0.75rem !important; }
  h1 { bottom: 3.35rem !important; }
}

</style>
</head>
<body>
  <p class="hud"><b>25</b>&nbsp;&nbsp;Wave PDE · ∂²h/∂t² = c²∇²h · caustic refraction · 1 draw call</p>
  <p class="read" id="read">E 0.00 mJ</p>
  <canvas id="c" aria-label="Interactive optical caustic wave tank — drag or press to disturb the surface"></canvas>
  <h1>Refracted<span>caustics.</span></h1>
  <p class="hint">Drag for a wake · press for a resonant plunge</p>

  <div class="dock" role="group" aria-label="Wave regime and theme">
    <button type="button" data-mode="rain" aria-pressed="true">Rain</button>
    <button type="button" data-mode="dipole" aria-pressed="false">Interference</button>
    <button type="button" data-mode="calm" aria-pressed="false">Still</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-th="obsidian" aria-pressed="true" data-theme-btn="1">Obsidian</button>
    <button type="button" data-th="paper" aria-pressed="false" data-theme-btn="1">Paper</button>
    <button type="button" data-th="aegean" aria-pressed="false" data-theme-btn="1">Aegean</button>
  </div>

  <script>
    (() => {
      'use strict';

      /* ---- Minimal AK-compatible runtime ---- */
      const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
      const rgb = (v) => {
        const s = css(v);
        if (s.startsWith('#')) {
          const h = s.slice(1);
          if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
          if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
        }
        const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
        return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
      };

      const cv = document.getElementById('c');
      const readEl = document.getElementById('read');

      /* ---- 2D Shallow-Water Wave PDE (224 × 140) ---- */
      const NX = 224, NY = 140, SZ = NX * NY;
      let h0 = new Float32Array(SZ), h1 = new Float32Array(SZ), h2 = new Float32Array(SZ);
      const texData = new Uint8Array(SZ * 4);
      let mode = 'rain', dropTimer = 0, energy = 0;

      function drop(gx, gy, rad, amp) {
        const r = Math.ceil(rad), r2 = rad * rad;
        const x0 = Math.max(2, (gx - r) | 0), x1 = Math.min(NX - 3, (gx + r) | 0);
        const y0 = Math.max(2, (gy - r) | 0), y1 = Math.min(NY - 3, (gy + r) | 0);
        for (let j = y0; j <= y1; j++) {
          const dy = j - gy, row = j * NX;
          for (let i = x0; i <= x1; i++) {
            const dx = i - gx, d2 = dx * dx + dy * dy;
            if (d2 < r2) {
              const w = Math.cos(Math.sqrt(d2) / rad * Math.PI * 0.5);
              h1[row + i] += amp * w * w;
            }
          }
        }
      }

      function stepPDE(t) {
        if (mode === 'rain') {
          dropTimer -= 1;
          if (dropTimer <= 0) {
            drop(16 + Math.random() * (NX - 32), 14 + Math.random() * (NY - 28), 3.6 + Math.random() * 2.2, (Math.random() > 0.3 ? -1 : 1) * (0.42 + Math.random() * 0.35));
            dropTimer = 22 + ((Math.random() * 28) | 0);
          }
        } else if (mode === 'dipole') {
          const w = Math.sin(t * 7.2) * 0.34;
          drop(NX * 0.36, NY * 0.5, 3.2, w);
          drop(NX * 0.64, NY * 0.5, 3.2, -w);
        }

        const c2 = 0.215, damp = 0.989;
        let sumE = 0;
        for (let y = 1; y < NY - 1; y++) {
          const row = y * NX;
          /* soft sponge damping near borders kills ugly box reflections */
          const ey = Math.min(y, NY - 1 - y);
          const sy = ey < 10 ? 0.92 + 0.08 * (ey / 10) : 1;
          for (let x = 1; x < NX - 1; x++) {
            const k = row + x;
            const ex = Math.min(x, NX - 1 - x);
            const sp = ex < 10 ? sy * (0.92 + 0.08 * (ex / 10)) : sy;
            const lap = (h1[k - 1] + h1[k + 1] + h1[k - NX] + h1[k + NX]) * 0.2
                      + (h1[k - NX - 1] + h1[k - NX + 1] + h1[k + NX - 1] + h1[k + NX + 1]) * 0.05
                      - h1[k];
            const v = (2 * h1[k] - h0[k] + c2 * lap) * damp * sp;
            h2[k] = v > 1.8 ? 1.8 : v < -1.8 ? -1.8 : v;
            sumE += v * v;
          }
        }
        energy = sumE * 0.012;
        const tmp = h0; h0 = h1; h1 = h2; h2 = tmp;
      }

      /* Pack height (R), dx (G), dy (B), curvature/caustic (A) into RGBA8 */
      function packTexture() {
        for (let y = 0; y < NY; y++) {
          const ym = y > 0 ? y - 1 : 0, yp = y < NY - 1 ? y + 1 : NY - 1;
          for (let x = 0; x < NX; x++) {
            const xm = x > 0 ? x - 1 : 0, xp = x < NX - 1 ? x + 1 : NX - 1;
            const k = y * NX + x, o = k * 4;
            const h = h1[k];
            const dx = (h1[y * NX + xp] - h1[y * NX + xm]) * 0.5;
            const dy = (h1[yp * NX + x] - h1[ym * NX + x]) * 0.5;
            const lap = (h1[y * NX + xm] + h1[y * NX + xp] + h1[ym * NX + x] + h1[yp * NX + x]) * 0.25 - h;
            texData[o]     = Math.max(0, Math.min(255, (h * 0.5 + 0.5) * 255));
            texData[o + 1] = Math.max(0, Math.min(255, (dx * 1.6 + 0.5) * 255));
            texData[o + 2] = Math.max(0, Math.min(255, (dy * 1.6 + 0.5) * 255));
            texData[o + 3] = Math.max(0, Math.min(255, (lap * 4.5 + 0.5) * 255));
          }
        }
      }

      /* ---- Pointer interaction (smooth wake + plunge) ---- */
      const P = { x: 0, y: 0, lx: 0, ly: 0, down: false, in: false };
      const toGrid = (e) => {
        const r = cv.getBoundingClientRect();
        return [(e.clientX - r.left) / Math.max(1, r.width) * NX, (e.clientY - r.top) / Math.max(1, r.height) * NY];
      };
      cv.addEventListener('pointerdown', (e) => {
        const [gx, gy] = toGrid(e);
        P.x = P.lx = gx; P.y = P.ly = gy; P.down = P.in = true;
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
        drop(gx, gy, 6.2, -1.15);
      });
      cv.addEventListener('pointermove', (e) => {
        const [gx, gy] = toGrid(e);
        if (!P.in) { P.lx = gx; P.ly = gy; P.in = true; }
        const dist = Math.hypot(gx - P.lx, gy - P.ly);
        const steps = Math.min(8, Math.max(1, Math.ceil(dist * 0.6)));
        for (let s = 1; s <= steps; s++) {
          const u = s / steps;
          drop(P.lx + (gx - P.lx) * u, P.ly + (gy - P.ly) * u, P.down ? 4.4 : 2.9, P.down ? -0.45 : -0.18);
        }
        P.lx = P.x = gx; P.ly = P.y = gy;
      }, { passive: true });
      const up = () => { P.down = false; };
      cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
      cv.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });

      /* ---- WebGL Single-Draw-Call Optical Caustic & Chromatic Refraction Shader ---- */
      const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
      let U = null, tex = null, c2d = null, off = null, octx = null, img2d = null;

      if (gl) {
        const VS = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
        const FS = `precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform vec3 uBg, uFlame, uCyan, uInk;
uniform float uDark;

float gridPattern(vec2 p) {
  vec2 g = abs(fract(p - 0.5) - 0.5) / max(vec2(0.001), fwidth_approx(p));
  return 1.0 - min(min(g.x, g.y), 1.0);
}
float gridLine(vec2 p, float w) {
  vec2 f = abs(fract(p) - 0.5);
  float gx = smoothstep(0.5 - w, 0.5, f.x);
  float gy = smoothstep(0.5 - w, 0.5, f.y);
  return max(gx, gy);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 suv = vec2(uv.x, 1.0 - uv.y);
  vec4 s = texture2D(uTex, suv);

  float h  = (s.r - 0.5) * 2.0;
  vec2 g   = (s.gb - 0.5) * 2.4;
  float cv = (s.a - 0.5) * 2.0;
  vec3 n   = normalize(vec3(-g.x * 2.6, g.y * 2.6, 1.0));

  /* Chromatic refraction onto submerged architectural grid */
  float aspect = uRes.x / max(1.0, uRes.y);
  vec2 base = (uv - 0.5) * vec2(aspect, 1.0) * 10.5;
  float grR = gridLine(base + g * 0.42, 0.016);
  float grG = gridLine(base + g * 0.36, 0.016);
  float grB = gridLine(base + g * 0.30, 0.016);
  float sub = gridLine((base + g * 0.36) * 4.0, 0.012) * 0.25;

  /* Physical caustic focusing where curvature concentrates rays */
  float cFocus = pow(clamp(-cv * 1.45, 0.0, 1.4), 1.55);
  float cShift = pow(clamp(-(texture2D(uTex, suv + g * 0.012).a - 0.5) * 2.6, 0.0, 1.4), 1.7);

  /* Overhead key + studio window reflection + Fresnel4 rim */
  vec3 view = vec3(0.0, 0.0, 1.0);
  vec3 light = normalize(vec3(-0.45, 0.65, 0.85));
  float spec = pow(max(dot(reflect(-light, n), view), 0.0), 72.0);
  float fre  = pow(1.0 - max(dot(n, view), 0.0), 4.0);
  float dif  = max(dot(n, light), 0.0);

  vec3 col = uBg;
  /* Subtle submerged grid with chromatic dispersion fringes */
  vec3 gridCol = mix(uInk * 0.14, uInk * 0.22, uDark);
  col += vec3(grR, grG, grB) * gridCol * (0.45 + 0.55 * dif);
  col += (uFlame * grR + uCyan * grB) * length(g) * 0.48;
  col += uInk * sub * 0.06;

  /* Molten caustic light webs on the tank floor */
  col += uFlame * (cFocus * 0.72 + cShift * 0.32);
  col += uCyan  * (cShift * 0.24) * smoothstep(0.15, 0.9, length(g));
  col += uInk   * (pow(cFocus, 2.2) * 0.55);

  /* Surface specular glint & Fresnel rim */
  col += uInk * (spec * 0.95 + fre * 0.26);
  col += uFlame * fre * 0.32;

  /* Soft vignette + 8-bit dither */
  float vig = 1.0 - 0.32 * dot(uv - 0.5, uv - 0.5);
  col *= mix(1.0, vig, uDark);
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.014;
  gl_FragColor = vec4(col, 1.0);
}`.replace(/float gridPattern[\s\S]*?\n\}\n/, '');

        const mk = (t, src) => { const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh); return sh; };
        const pr = gl.createProgram();
        gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS));
        gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(pr);
        if (gl.getProgramParameter(pr, gl.LINK_STATUS)) {
          gl.useProgram(pr);
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
          const loc = gl.getAttribLocation(pr, 'p');
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

          tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

          U = {};
          ['uTex', 'uRes', 'uBg', 'uFlame', 'uCyan', 'uInk', 'uDark'].forEach((k) => U[k] = gl.getUniformLocation(pr, k));
          gl.uniform1i(U.uTex, 0);
        } else {
          U = null;
        }
      }

      if (!U) {
        c2d = cv.getContext('2d');
        off = document.createElement('canvas'); off.width = NX; off.height = NY;
        octx = off.getContext('2d'); img2d = octx.createImageData(NX, NY);
      }

      /* ---- Live theme sync (URL ?theme=, postMessage ak-theme, or dock buttons) ---- */
      let cBg = [7,7,9], cFl = [255,61,0], cCy = [0,240,255], cIn = [244,242,236];
      function syncTheme() {
        cBg = rgb('--bg'); cFl = rgb('--flame'); cCy = rgb('--cyan'); cIn = rgb('--ink');
        if (gl && U) {
          gl.uniform3f(U.uBg, cBg[0]/255, cBg[1]/255, cBg[2]/255);
          gl.uniform3f(U.uFlame, cFl[0]/255, cFl[1]/255, cFl[2]/255);
          gl.uniform3f(U.uCyan, cCy[0]/255, cCy[1]/255, cCy[2]/255);
          gl.uniform3f(U.uInk, cIn[0]/255, cIn[1]/255, cIn[2]/255);
          gl.uniform1f(U.uDark, cBg[0] < 90 ? 1.0 : 0.0);
        }
      }
      function setTheme(name) {
        document.documentElement.setAttribute('data-theme', name);
        document.querySelectorAll('[data-th]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.th === name)));
        syncTheme();
      }
      document.querySelectorAll('[data-th]').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.th)));
      document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
        mode = b.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
        if (mode === 'dipole') { drop(NX * 0.36, NY * 0.5, 5, -0.9); drop(NX * 0.64, NY * 0.5, 5, 0.9); }
      }));
      window.addEventListener('message', (e) => { if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) setTheme(e.data.theme); });
      try { const qs = new URLSearchParams(location.search).get('theme'); if (qs) setTheme(qs); } catch (_) {}
      syncTheme();

      /* ---- Pre-warm with two crossing interference ripples so frame 1 is luminous ---- */
      drop(NX * 0.34, NY * 0.44, 7.5, -1.25);
      drop(NX * 0.66, NY * 0.56, 6.5, -1.05);
      for (let i = 0; i < 42; i++) stepPDE(i / 60);

      /* ---- Main Loop (visibility-paused + adaptive DPR) ---- */
      let raf = 0, last = 0, elapsed = 0, scale = 1.5, slow = 0, frameN = 0;
      function render() {
        packTexture();
        const cw = Math.max(1, cv.clientWidth), ch = Math.max(1, cv.clientHeight);
        const dpr = Math.min(scale, window.devicePixelRatio || 1);
        const w = Math.round(cw * dpr), h = Math.round(ch * dpr);
        if (cv.width !== w || cv.height !== h) {
          cv.width = w; cv.height = h;
          if (gl && U) gl.viewport(0, 0, w, h);
        }
        if (gl && U) {
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, NX, NY, 0, gl.RGBA, gl.UNSIGNED_BYTE, texData);
          gl.uniform2f(U.uRes, w, h);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        } else if (c2d) {
          const d = img2d.data;
          for (let i = 0; i < SZ; i++) {
            const o = i * 4, caus = Math.max(0, -(texData[o + 3] / 255 - 0.5) * 3.2);
            for (let c = 0; c < 3; c++) d[o + c] = Math.min(255, cBg[c] + (cFl[c] - cBg[c]) * caus + cIn[c] * caus * caus * 0.5);
            d[o + 3] = 255;
          }
          octx.putImageData(img2d, 0, 0);
          c2d.imageSmoothingEnabled = true; c2d.imageSmoothingQuality = 'high';
          c2d.drawImage(off, 0, 0, w, h);
        }
        if ((frameN++ & 3) === 0) readEl.textContent = 'E ' + energy.toFixed(2) + ' mJ';
      }

      function tick(now) {
        raf = requestAnimationFrame(tick);
        if (document.hidden) { last = 0; return; }
        const dt = last ? Math.min(0.033, Math.max(0.004, (now - last) / 1000)) : 1 / 60;
        last = now; elapsed += dt;
        slow = dt > 0.024 ? slow + 1 : Math.max(0, slow - 1);
        if (slow > 30 && scale > 0.75) { scale -= 0.25; slow = 0; }
        if (!RM) { stepPDE(elapsed); stepPDE(elapsed + 0.008); }
        render();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
        else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
      });
      render();
      if (!RM) raf = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
