<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root, :root[data-theme="obsidian"] {
  --bg: #070709;
  --surface: #0d0d12;
  --surface-hi: #12121a;
  --ink: #f4f2ec;

</style></head><body>
<p class="hud"><b>23</b>&nbsp;&nbsp;Lorenz system · σ 10 · ρ 28 · β 8⁄3 · RK4</p>
<p class="read" id="read">x 0.0 · y 0.0 · z 0.0</p>
<canvas id="c" aria-label="A rotating Lorenz strange attractor"></canvas>
<p class="hint">Drag to spin · it coasts on its own inertia</p>
<script>
const AK = (() => {
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const themeCbs = new Set();
  const applyTheme = (name) => {
    if (!name) return;
    document.documentElement.setAttribute('data-theme', name);
    themeCbs.forEach((fn) => { try { fn(name); } catch (_) {} });
  };
  try {
    const qs = new URLSearchParams(location.search).get('theme');
    if (qs) applyTheme(qs);
  } catch (_) {}
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'ak-theme' && e.data.theme) applyTheme(e.data.theme);
  });

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ffffff';
  const rgb = (v) => {
    const s = css(v);
    if (s.startsWith('#')) {
      const h = s.slice(1);
      if (h.length === 3) return [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)];
      if (h.length >= 6) return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    const m = s.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [244, 242, 236];
  };
  const rgba = (v, a) => {
    const c = rgb(v);
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  };
  const fit = (cv) => {
    const ctx = cv.getContext('2d');
    const S = { ctx, W: 1, H: 1, dpr: 1 };
    const resize = () => {
      const r = cv.getBoundingClientRect();
      S.W = Math.max(1, Math.round(r.width || window.innerWidth));
      S.H = Math.max(1, Math.round(r.height || window.innerHeight));
      S.dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(S.W * S.dpr);
      cv.height = Math.round(S.H * S.dpr);
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    };
    resize();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(cv);
    window.addEventListener('resize', resize, { passive: true });
    return S;
  };
  const ptr = (el) => {
    const P = { x: 0, y: 0, dx: 0, dy: 0, down: false, in: false, onDown: null, onUp: null };
    const upd = (e) => {
      const r = el.getBoundingClientRect();
      const nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (P.in) { P.dx += nx - P.x; P.dy += ny - P.y; }
      P.x = nx; P.y = ny; P.in = true;
    };
    el.addEventListener('pointerdown', (e) => {
      upd(e); P.down = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      if (P.onDown) P.onDown(e);
    });
    el.addEventListener('pointermove', upd, { passive: true });
    const up = (e) => {
      if (!P.down) return;
      P.down = false;
      if (P.onUp) P.onUp(e);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', () => { if (!P.down) P.in = false; });
    return P;
  };
  const loop = (fn) => {
    let raf = 0, last = 0, elapsed = 0;
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      const raw = last ? (now - last) / 1000 : 1 / 60;
      last = now;
      const dt = Math.min(0.033, Math.max(0.001, raw));
      elapsed += dt;
      fn(dt, elapsed);
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
      else if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(tick); }
    });
    raf = requestAnimationFrame(tick);
  };
  return { RM, css, rgb, rgba, fit, ptr, loop, onTheme: (fn) => themeCbs.add(fn) };
})();
(() => {
  'use strict';
  const cv = document.getElementById('c'), S = AK.fit(cv), ctx = S.ctx, P = AK.ptr(cv), read = document.getElementById('read');
  const N = 1700, COLS = ['--flame', '--ink', '--gold'];
  const f = (p) => [10 * (p[1] - p[0]), p[0] * (28 - p[2]) - p[1], p[0] * p[1] - 8 / 3 * p[2]];
  const ad = (p, k, h) => [p[0] + k[0] * h, p[1] + k[1] * h, p[2] + k[2] * h];
  function rk4(p, h) { const a = f(p), b = f(ad(p, a, h / 2)), c = f(ad(p, b, h / 2)), d = f(ad(p, c, h)); return [0, 1, 2].map((i) => p[i] + h / 6 * (a[i] + 2 * b[i] + 2 * c[i] + d[i])); }
  const tr = COLS.map((c, i) => { let p = [0.1 + i * 0.02, 0, 20]; const buf = new Float32Array(N * 3); for (let k = 0; k < 400; k++) p = rk4(p, 0.008); for (let k = 0; k < N; k++) { p = rk4(p, 0.008); buf.set(p, k * 3); } return { c, p, buf, head: 0 }; });
  let yaw = 0.6, pitch = 0.22, wy = 0.22, wp = 0;
  P.onDown = () => cv.classList.add('grab'); P.onUp = () => cv.classList.remove('grab');
  const SX = new Float32Array(N), SY = new Float32Array(N), SZ = new Float32Array(N);

  AK.loop((dt) => {
    const W = S.W, H = S.H; ctx.clearRect(0, 0, W, H);
    if (P.down) { wy = wy * 0.5 + (P.dx * 0.006 / Math.max(dt, 0.008)) * 0.5; wp = wp * 0.5 + (P.dy * 0.004 / Math.max(dt, 0.008)) * 0.5; P.dx = P.dy = 0; }
    else { wy += (0.22 - wy) * (1 - Math.exp(-0.9 * dt)); wp *= Math.exp(-3 * dt); }
    yaw += wy * dt; pitch = Math.max(-0.9, Math.min(0.9, pitch + wp * dt));
    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), sc = Math.min(W, H) / 62, dark = AK.rgb('--bg')[0] < 90;
    ctx.strokeStyle = AK.css('--line'); ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(W / 2, H * 0.52 + 24 * sc * cp * 0.9, 26 * sc, 26 * sc * Math.abs(sp) + 1, 0, 0, 6.283); ctx.stroke();
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const t of tr) {
      for (let s = 0; s < 3; s++) { t.p = rk4(t.p, 0.0075); t.buf.set(t.p, t.head * 3); t.head = (t.head + 1) % N; }
      for (let i = 0; i < N; i++) {
        const k = ((t.head + i) % N) * 3, x = t.buf[k], y = t.buf[k + 1], z = t.buf[k + 2] - 25;
        const x1 = x * cyw - y * syw, y1 = x * syw + y * cyw;
        const yy = -z * cp + y1 * sp, zz = z * sp + y1 * cp, pz = 90 / (90 + zz);
        SX[i] = W / 2 + x1 * sc * pz; SY[i] = H * 0.52 + yy * sc * pz; SZ[i] = zz;
      }
      const CH = 12;
      for (let i = 0; i + 1 < N; i += CH) {
        const age = i / N, depth = Math.max(0, Math.min(1, 0.5 - SZ[i] / 60));
        ctx.strokeStyle = AK.rgba(t.c, (0.06 + age * age * 0.8) * (0.3 + depth * 0.7)); ctx.lineWidth = (0.5 + depth * 1.7) * (0.6 + age * 0.6);
        ctx.beginPath(); ctx.moveTo(SX[i], SY[i]); const e = Math.min(N - 1, i + CH); for (let k = i + 1; k <= e; k++) ctx.lineTo(SX[k], SY[k]); ctx.stroke();
      }
      const hx = SX[N - 1], hy = SY[N - 1], g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 16); g.addColorStop(0, AK.rgba(t.c, 0.9)); g.addColorStop(0.25, AK.rgba(t.c, 0.35)); g.addColorStop(1, AK.rgba(t.c, 0));
      ctx.fillStyle = g; ctx.fillRect(hx - 16, hy - 16, 32, 32);
    }
    ctx.globalCompositeOperation = 'source-over';
    const p = tr[0].p; read.textContent = `x ${p[0].toFixed(1)} · y ${p[1].toFixed(1)} · z ${p[2].toFixed(1)}`;
  });
})();
</script></body></html>
